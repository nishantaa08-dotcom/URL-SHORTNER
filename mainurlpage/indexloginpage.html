<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="/stylelogin.css">
</head>
<body id="maincontent">
    <div class="login">
        <spam id="login">LOGIN</spam>
        <form id="form">
            <div id="username">
                <label class="label">USERNAME :</label>
                <input type="text" class="input0" name="username" placeholder="username" required>
            </div>
            <div id="password">
                <label class="label">PASSWORD :</label>
                <input type="password" id="pass" class="input0" name="password" placeholder="password" required>
                <label class="label">
                    <input type="checkbox" id="look"><spam class="spam">Show password</spam>
                </label>
            </div>
            <button id="btn" type="submit">LOGIN</button>
        </form>
        
    </div>
    <div class="flow">
        <a href="index.html">Not Have account Sign-up</a>
    </div>
    <button id="dark">Dark Mode</button>
    <div id="popup">LOGIN SUCCESFULLY</div>
</body>
<script src="/scriptlogin.js"></script>
</html>
