<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/style1.css">
</head>
<body>
    <div class="heading">
        <h1><span>Welcome</span> back</h1>
        <p>Create and manage your short links.</p>
    </div>
    <div id="main">
        <div class="container">
            <form id="data-url">
                <h4>Create short URL</h4>
                <div class="url">
                    <label> ENTER URL</label>
                    <textarea type="link" class="scroll" name="url" placeholder="link"></textarea>
                </div>
                <div class="url">
                    <label>ENTER SHORTCODE</label>
                    <input type="link" name="shortcode" placeholder="shortcode">
                </div>
                <div class="click">
                    <button id="btn">SHORT-URL</button>    
                </div>   
            </form>
        </div>
        <div class="showdata">
            <h3>Your Short URLs</h3>
            <h5>Your generated links appear here</h5>
            <ul id="fdata"></ul>
        </div>
    </div>
   
    <script src="/main.js"></script>
</body>
</html>
