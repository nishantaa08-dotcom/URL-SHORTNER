<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up Page</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="main">
        <div class="signupform">
            <div id="signup">SIGN-UP</div>
            <form id="form">
                <div id="name">
                    <label class="label">NAME :</label>
                    <input class="input0" type="text" name="name" placeholder="name" required>
                </div>
                <div id="email">
                    <label class="label">EMAIL :</label>
                    <input class="input0" type="email" name="email" placeholder="email" required>
                </div>
                <div class="password">
                    <label class="label">PASSWORD :</label>
                    <input class="input0" id="pass" type="password" name="password" placeholder="password" required>
                    <label>
                        <input type="checkbox" class="input1"id="look"><span> Show Password</span>
                    </label>
                </div>
                <div class="password">
                    <label class="label">CONFORM PASSWORD :</label>
                    <input class="input0" id="repass" type="password" name="conformpassword" placeholder="conformPassword" required>
                </div>
                <button type="submit" id="btn">SIGNUP</button>
                <div class="flow">
                    <a href="/loginpage">Have account then Login</a>
                </div>
            </form>
        </div>
    </div>
    <button id="dark">Dark Mode</button>
    <div id="popup">SIGNUP SUCCESFULLY</div>
</body>
<script src="/script.js"></script>
</html>
